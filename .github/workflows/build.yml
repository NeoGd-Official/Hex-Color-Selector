name: Build Hex Color Selector

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Hex-Color-Selector-${{ matrix.name }}
          path: build/*.geode
